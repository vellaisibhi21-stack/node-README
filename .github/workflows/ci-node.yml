# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Node.js CI — generated by LaneSync.
# Runs your real test suite, produces HTML reports, and uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci 2>/dev/null || npm install
            TEST_SCRIPT=$(node -p 'require("./package.json").scripts?.test || ""')
            if [[ "$TEST_SCRIPT" == *jest* ]]; then
              npm install --no-save jest-html-reporter
            fi
          else
            echo "No package.json found — skipping install. Add a package.json to get started."
          fi

      - name: Run unit tests
        run: |
          TEST_SCRIPT=""
          [ ! -f package.json ] || TEST_SCRIPT=$(node -p 'require("./package.json").scripts?.test || ""')
          mkdir -p coverage
          if [[ "$TEST_SCRIPT" =~ ^node[[:space:]]+--test([[:space:]]+--experimental-test-coverage)?$ ]]; then
            npm test -- --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination=junit.xml \
              --test-reporter=lcov --test-reporter-destination=coverage/lcov.info || TEST_EXIT=$?
          elif [[ "$TEST_SCRIPT" == *jest* ]] && [ -x node_modules/.bin/jest ]; then
            npx --no-install jest --coverage --passWithNoTests \
              --reporters=default --reporters=jest-html-reporter \
              --coverageReporters=html --coverageReporters=cobertura \
              --json --outputFile=jest-results.json 2>/dev/null || TEST_EXIT=$?
            [ -f test-report.html ] && mv test-report.html unit-tests.html || true
          elif [ -n "$TEST_SCRIPT" ]; then
            # Custom runners own their reports; never replace the application's tests with Jest.
            npm test || TEST_EXIT=$?
          fi
          [ -f unit-tests.html ] || \
            echo "<html><body><h1>Unit Tests</h1><p>Test output is available in the CI log and native report artifacts.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     npm run test:integration -- --reporters=jest-html-reporter
      #     mv test-report.html integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          # Scan source only: generated reports, dependencies and build output are not the customer's code.
          # Findings never fail CI (no --error), so a non-zero exit means the scan itself failed:
          # send no report rather than a partial one that reads as clean.
          if ! opengrep scan --config auto --exclude .github --exclude coverage --exclude unit-tests.html \
            --exclude integration-tests.html --exclude node_modules --exclude dist --exclude build \
            --sarif -o sast.sarif . 2>/dev/null; then
            echo "::warning::SAST scan did not complete; LaneSync will show SAST as not measured."
            rm -f sast.sarif
          fi

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            unit-tests.html
            integration-tests.html
            sast.sarif
            trivy.json
            jest-results.json
            junit.xml
            coverage/
          retention-days: 30

      - name: Upload evidence to LaneSync
        uses: ./.github/actions/lanesync-upload
        if: always()
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://unrelishable-erika-nonfactiously.ngrok-free.dev' }}
          api-key: ${{ secrets.LANESYNC_API_KEY }}
          dev-branch: "main"
          release-prefix: "release/"
          pipeline: "CI — Build & Test"

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION=${BRANCH_NAME#release/}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
