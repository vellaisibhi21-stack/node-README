version: v1
name: your-app-name
quality_gates:
  coverage:
    min_line_percent: 80
  security:
    max_critical: 0
    max_high: 0
    max_medium: 20
  sast_scan:
    max_critical: 0
    max_high: 0
    max_medium: 10
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    required_checks:
      - CI — Build & Test
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: release/**
    deploy_target: staging
    required_checks:
      - Deploy to Staging
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    required_checks:
      - Deploy to Production
    promotion: manual
    requires_evidence_approval: true
